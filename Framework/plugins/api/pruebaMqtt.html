<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="">
	<meta name="author" content="David Ruiz">
	<title>CORDOWARE - Chat Test</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

	<style type="text/css">
		html,
		body {
			height: 100%;
		}

		body {
			display: flex;
			align-items: center;
			padding-top: 40px;
			padding-bottom: 40px;
			background-color: #f5f5f5;
		}

		.form-mobile {
			max-width: 360px;
			padding: 15px;
		}

			.form-mobile .form-floating:focus-within {
				z-index: 2;
			}

			.form-mobile .screen {
				height: 400px;
				padding: 1px;
				background-color: #333;
				color: #30a314;
				font-size: 9px;
				border-radius: 5px;
			}

			.form-mobile #messagelist {
				margin-top: 20px;
			}
	</style>
</head>
<body>

	<main class="form-mobile w-100 m-auto">
		<form>
			<img class="mb-4" src="https://cordoware.es/wp-content/uploads/2021/11/logo-2048x403.png" alt="CORDOWARE CHAT" height="57">
		
			<div class="form-group mb-3">
				<input id="userName" type="text" class="form-control" placeholder="Nombre a mostrar" aria-label="Nombre a mostrar">
			</div>
			
			<hr>

			<div class="form-floating mb-2">
				<div class="card">
					<div class="card-body">
						<div class="screen">
							 <ul id="messagelist"></ul>
						</div>
					</div>
				</div>
			</div>

			<div class="input-group mb-3">
				<input id="textMessage" type="text" class="form-control" placeholder="Introduzca su mensaje" aria-label="Introduzca su mensaje" aria-describedby="btnSend">
				<button id="btnSend" class="btn btn-primary" type="button" ><i class="bi bi-send-fill"></i></button>
			</div>
		</form>
	</main>
	
	<script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
	<script type="text/javascript">
	
		// Variables locales
		var brokerUrl = "mqtt.cordoware.com";
		var brokerPort = 8884;
		var clientId = "CordoChat_" + Math.floor(Math.random() * 100001);
		var chatTopic = "CordoChat";//Crear un topic par el juego
		var userName = "mqtt_admin";
		var password = "clddlmylddlp%lcylP%ts23";

		// Creamos una instancia del cliente
		client = new Paho.MQTT.Client(brokerUrl, Number(brokerPort), clientId);

		// Seteamos los handleds y opciones de conexión
		client.onConnectionLost = onConnectionLost;
		client.onMessageArrived = onMessageArrived;

		var connectionOptions = {
			timeout: 60,
			keepAliveInterval: 60,
			onSuccess: onConnect,
			userName : userName,
			password : password
			};

		// Conectamos el cliente
		client.connect(connectionOptions);

		// Función que se ejecuta cuando el cliente conecta
		function onConnect() {

			// log de consola
			console.log("Conectado al broker");
			
			// Subscripcion a topics del chat (todos los usuarios)
			client.subscribe(chatTopic + "/#");
		}

		// Función que se ejecuta cuando el cliente pierde la conexion
		function onConnectionLost(responseObject) {
			if (responseObject.errorCode !== 0) {
				console.log("onConnectionLost:" + responseObject.errorMessage);
			}
		}

		// Función que se ejecuta cuando llega un mensaje al broker
		function onMessageArrived(message) {

			var userTopic = message.destinationName.split("/");
			var userChatName = userTopic[1];
			
			$('#messagelist').append('<li class="list-group-item"><b>#' + userChatName.toUpperCase() + '</b> >> ' + message.payloadString + '</li>');
		}

		// Listeners de los controles de la web (página cargada)
		$(document).ready(function() {
		
			// Listener para el evento click del botón enviar mensaje
			$("#btnSend").click(function () {
			
				// Nombre de usuario a mostrar
				var chatUser = $('#userName').val();
				if (chatUser === ""){
					chatUser = clientId;
				}
		
				var testSms = $("#textMessage").val();
				if (testSms === ""){
					return;
				}
				
				// Creamos el mensaje
				message = new Paho.MQTT.Message($("#textMessage").val());
				message.qos = 2;
				message.destinationName = chatTopic + "/" + chatUser;
				
				client.send(message);
				
				// Limpiamos el mensaje
				$("#textMessage").val("");
			});
			
			// Listener para el evento keypress del textbox de mensaje
			$("#textMessage").keypress(function(e){
			
				if(e.which==13){ // Si se pulsa el return
					e.preventDefault();
					
					// Enviamos el mensaje
					$("#btnSend").trigger("click");
				}
				
			});
		});

	</script>

</body>
</html>
