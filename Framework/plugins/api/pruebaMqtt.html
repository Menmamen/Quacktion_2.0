<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat MQTT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2 class="text-center">Chat MQTT</h2>
        <div class="mb-3">
            <input id="userName" type="text" class="form-control" placeholder="Tu nombre" required>
        </div>
        <div class="card">
            <div class="card-body" id="chatBox" style="height: 300px; overflow-y: auto; background: #f8f9fa; padding: 10px;"></div>
        </div>
        <div class="input-group mt-3">
            <input id="textMessage" type="text" class="form-control" placeholder="Escribe un mensaje">
            <button id="btnSend" class="btn btn-primary">Enviar</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script>
        var broker = "broker.hivemq.com";
        var port = 8000;
        var topic = "ChatGlobal";
        var clientId = "User_" + Math.floor(Math.random() * 10000);
        
        var client = new Paho.MQTT.Client(broker, port, clientId);
        
        client.onMessageArrived = function(message) {
            var chatBox = document.getElementById("chatBox");
            var msg = document.createElement("p");
            msg.textContent = message.payloadString;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        };
        
        client.connect({ onSuccess: function() {
            console.log("Conectado a MQTT");
            client.subscribe(topic);
        }});
        
        document.getElementById("btnSend").addEventListener("click", function() {
            var user = document.getElementById("userName").value || clientId;
            var text = document.getElementById("textMessage").value;
            if (text.trim() === "") return;
            
            var message = new Paho.MQTT.Message(user + ": " + text);
            message.destinationName = topic;
            client.send(message);
            document.getElementById("textMessage").value = "";
        });
    </script>
</body>
</html>
