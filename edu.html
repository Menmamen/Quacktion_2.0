<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Quacktion</title>
  <!-- Enlaza Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
  <!-- Estilos propios (si los necesitas) -->
  <style>
    /* Ejemplo de fondo con patrón (sustituye la URL por tu imagen real) */
    body {
      background: #2C3E3E url("ruta-a-tu-patron.png") repeat;
      min-height: 100vh;
      color: #fff;
    }

    /* Caja con fondo semitransparente o sólido (personaliza a tu gusto) */
    .custom-box {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
    }

    /* Logo circular, ajusta tamaño a tu gusto */
    .logo-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    /* Botones centrados */
    .btn-block {
      display: block;
      width: 100%;
      margin-bottom: 10px;
    }

    footer a {
      color: #fff;
      text-decoration: none;
      margin: 0 10px;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Contenedor principal -->
  <div class="container py-5">
    <div class="row justify-content-center text-center">
      <!-- Sección central con el logo y los botones -->
      <div class="col-12 mb-4">
        <!-- Logo y nombre del juego -->
        <div class="mb-3">
          <!-- Sustituye la imagen por tu logo real -->
          <img src="ruta-a-tu-logo.png" alt="Logo Quacktion" class="logo-img" />
          <h1 class="mt-3">Quacktion</h1>
        </div>

        <!-- Botones de acción -->
        <div class="d-flex flex-column align-items-center">
          <button class="btn btn-primary btn-block mb-2">
            Jugar como invitado
          </button>
          <button class="btn btn-secondary btn-block">
            Iniciar sesión
          </button>
        </div>
      </div>

      <!-- Contenido lateral: izquierda y derecha -->
      <div class="col-md-4 mb-3">
        <div class="custom-box h-100 d-flex flex-column align-items-center justify-content-center">
          <!-- Trofeo -->
          <div class="mb-3">
            <!-- Usa un icono, imagen o SVG, por ejemplo FontAwesome -->
            <i class="bi bi-trophy-fill" style="font-size: 3rem;"></i>
          </div>
          <!-- Lista de usuarios (iconos) -->
          <div class="d-flex flex-column align-items-center">
            <!-- Sustituye por imágenes de usuario, avatares o iconos -->
            <div class="mb-2">
              <img src="ruta-a-avatar1.png" alt="Avatar1" width="40" height="40" class="rounded-circle" />
            </div>
            <div class="mb-2">
              <img src="ruta-a-avatar2.png" alt="Avatar2" width="40" height="40" class="rounded-circle" />
            </div>
            <div>
              <img src="ruta-a-avatar3.png" alt="Avatar3" width="40" height="40" class="rounded-circle" />
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-3">
        <div class="custom-box h-100 d-flex flex-column align-items-center justify-content-center">
          <!-- Ejemplo de ilustración del avión de papel o animaciones -->
          <div class="mb-3">
            <!-- Sustituye por tu propia imagen o animación -->
            <img src="ruta-a-tu-avion.png" alt="Avión de papel" width="80" />
          </div>
          <!-- Puntos de paginación o slider (si fuese un carrusel) -->
          <div class="d-flex">
            <span class="mx-1">●</span>
            <span class="mx-1">●</span>
            <span class="mx-1">●</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Pie de página -->
  <footer class="text-center py-3">
    <a href="#contact">Contact</a> |
    <a href="#terms">Terms of Service</a> |
    <a href="#privacy">Privacy Settings</a>
  </footer>

  <!-- Enlaza Bootstrap JS (opcional si no necesitas scripts de Bootstrap) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
